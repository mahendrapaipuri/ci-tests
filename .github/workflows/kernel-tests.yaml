name: "Workflow with matrix from output"

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  prepare:
    name: Prepare output
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.kernel_releases.outputs.releases }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Get latest kernel releases 
      id: kernel_releases
      shell: python
      run: |
        #!/usr/bin/env python3
        
        import os
        import json
        import urllib.request
        
        # Get GITHUB_OUTPUT env var to write the version URL strings
        GITHUB_OUTPUT = os.getenv('GITHUB_OUTPUT')
        
        try:
            # Fetch the JSON data
            with urllib.request.urlopen('https://www.kernel.org/releases.json') as response:
                data = json.loads(response.read())
        
            # Extract and print all source URLs
            releases = []
            for release in data['releases']:
                source = release.get('source', '')
                version = release.get('version', '')
                if source and version:
                    releases.append({'version': version ,'source': source})
        
            # Output all URLs
            with open(GITHUB_OUTPUT, 'w') as f:
                f.write(f"releases={json.dumps(releases)}")
            print(f"Kernel releases fetched successfully")
            for release in releases:
                print(f"Version: {release['version']}; Source: {release['source']}")
        except Exception as e:
            print(f"Unexpected error fetching kernel releases: {e}")
            exit(1)
  
  tests:
    name: Run tests
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        release: ${{ fromJSON(needs.prepare.outputs.releases) }}
    env:
      VERSION: ${{ matrix.release.version }}
      SOURCE: ${{ matrix.release.source }}
    steps:
    - name: Run test
      run: |
        echo "building for $VERSION $SOURCE"
